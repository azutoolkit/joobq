name: Crystal CI

# Pushes to master and manual runs. A push that touches only documentation (docs/, examples/docs/, its scripts, Markdown) skips this
# workflow; docs.yml checks those. Editing a workflow or a script always runs it.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "examples/docs/**", "scripts/*docs*", ".claude/**", ".github/ISSUE_TEMPLATE/**", ".github/*.md", "*.md", ".gitbook.yaml", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the CI image on ghcr.io

# Cancel superseded runs of a branch started by hand, but never on master: a master run must finish
# its tag-and-release step uninterrupted (a queued master run is replaced by the newest push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # One job per Redis version. The four worker-count / connection-style combinations differ only by environment, so
  # the specs are compiled once and the later combinations reuse Crystal's compile cache; the shard
  # install and the pinned Redis build are paid once per Redis version instead of once per combination.
  build:
    name: specs (Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.4.12", "8.0.6"]
    container:
      image: ghcr.io/azutoolkit/joobq-ci:1 # .github/ci-image: Crystal 1.22.1 and the system packages, no apt in a run
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: shards install --frozen
      - name: Pinned Redis with TLS (cached)
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: /tmp/test-redis
          key: redis-${{ matrix.redis }}-${{ hashFiles('scripts/install_test_redis.py') }}-crystal-1.22.1
      - name: Build pinned Redis with TLS
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install_test_redis.py "${{ matrix.redis }}" /tmp/test-redis
      - name: Put Redis on the PATH
        run: echo /tmp/test-redis/bin >> "$GITHUB_PATH"
      - name: Format
        run: crystal tool format --check src spec
      - name: Specs and recovery probes (workers 1 and 4, legacy and URL connections; no skips)
        run: |
          status=0
          leg() {
            local url=""
            [ "$2" = url ] && url="--url"
            python3 scripts/run_integration.py $url || return 1
            python3 scripts/redis_restart_smoke.py || return 1
            if [ "$1" = 4 ] && [ "$2" = url ]; then
              python3 scripts/run_integration.py --probe python3 scripts/leased_process_probe.py || return 1
              # Bounded fault soak smoke (not the four-hour release gate)
              crystal build benchmarks/soak.cr --release -o /tmp/joobq-soak || return 1
              SOAK_SECONDS=60 SOAK_RATE=50 python3 scripts/run_integration.py --probe /tmp/joobq-soak || return 1
              # Batched leased worker SIGKILL and bounded signal drain
              PROBE_BATCH_SIZE=8 python3 scripts/run_integration.py --probe python3 scripts/leased_process_probe.py || return 1
            fi
          }
          for workers in 1 4; do
            for connection in legacy url; do
              echo "::group::Redis ${{ matrix.redis }}, CRYSTAL_WORKERS=$workers, connection=$connection"
              CRYSTAL_WORKERS=$workers leg "$workers" "$connection" || { echo "::error::failed: Redis ${{ matrix.redis }}, CRYSTAL_WORKERS=$workers, connection=$connection"; status=1; }
              echo "::endgroup::"
            done
          done
          exit $status

  # The release lifecycle checks (versioning, atomic pushes, recovery with local Git remotes) run first in the
  # release job: they gate the same release without a runner of their own.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify manifest versions, protected branches and recovery with local Git remotes
        run: python3 .github/scripts/test_release.py
      - name: Tag the exact tested manifest version
        id: prepare
        run: python3 .github/scripts/release.py
      - name: Publish GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ steps.prepare.outputs.latest }}
        run: python3 .github/scripts/release.py --publish "$RELEASE_TAG" --latest "$RELEASE_LATEST"
