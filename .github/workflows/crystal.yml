name: Crystal CI

# Pushes to master and manual runs. A push that touches only documentation (docs/, examples/docs/, its scripts, Markdown) skips this
# workflow; docs.yml checks those. Editing a workflow or a script always runs it.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "examples/docs/**", "scripts/*docs*", ".claude/**", ".github/ISSUE_TEMPLATE/**", ".github/*.md", "*.md", ".gitbook.yaml", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the CI image on ghcr.io

# Cancel superseded runs of a branch started by hand, but never on master: a master run must finish
# its tag-and-release step uninterrupted (a queued master run is replaced by the newest push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Redis 8.0.6 with one runtime worker, once per connection style, each on its own runner. The CRYSTAL_WORKERS=4
  # legs, Redis 7.4.12, the leased-process SIGKILL probes and the soak smoke no longer run here (owner's decision);
  # scripts/leased_process_probe.py and benchmarks/soak.cr are still in the repository to run by hand.
  build:
    name: Redis ${{ matrix.redis }}, CRYSTAL_WORKERS=1, connection=${{ matrix.connection }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        redis: ["8.0.6"]
        connection: [legacy, url]
    container:
      image: ghcr.io/azutoolkit/joobq-ci:2 # .github/ci-image: Crystal 1.22.1 on Alpine, no package installs in a run
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      CRYSTAL_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: shards install --frozen
      - name: Pinned Redis with TLS (cached)
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: /tmp/test-redis
          key: redis-${{ matrix.redis }}-${{ hashFiles('scripts/install_test_redis.py') }}-crystal-1.22.1-alpine
      - name: Build pinned Redis with TLS
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install_test_redis.py "${{ matrix.redis }}" /tmp/test-redis
      - name: Put Redis on the PATH
        run: echo /tmp/test-redis/bin >> "$GITHUB_PATH"
      - name: Format
        run: crystal tool format --check src spec
      - name: Specs (no skips)
        run: python3 scripts/run_integration.py ${{ matrix.connection == 'url' && '--url' || '' }}
      - name: Redis restart smoke
        run: python3 scripts/redis_restart_smoke.py

  # The release lifecycle checks (versioning, atomic pushes, recovery with local Git remotes) run first in the
  # release job: they gate the same release without a runner of their own.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify manifest versions, protected branches and recovery with local Git remotes
        run: python3 .github/scripts/test_release.py
      - name: Tag the exact tested manifest version
        id: prepare
        run: python3 .github/scripts/release.py
      - name: Publish GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ steps.prepare.outputs.latest }}
        run: python3 .github/scripts/release.py --publish "$RELEASE_TAG" --latest "$RELEASE_LATEST"
