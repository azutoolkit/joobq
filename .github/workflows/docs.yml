name: Documentation
on:
  push:
    branches: [master]
    paths: ['docs/**', 'examples/docs/**', 'scripts/*docs*', '.gitbook.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read # the CI image on ghcr.io
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s scripts -p 'test_check_docs.py'
  core-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/azutoolkit/joobq-ci:2 # .github/ci-image: Crystal 1.22.1 on Alpine, no package installs in a run
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install released Core graph
        working-directory: examples/docs/core
        run: shards install --frozen
      # The same pinned build (and cache key) as the Redis 8.0.6 job of crystal.yml.
      - name: Pinned Redis (cached)
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: /tmp/test-redis
          key: redis-8.0.6-${{ hashFiles('scripts/install_test_redis.py') }}-crystal-1.22.1-alpine
      - name: Build pinned Redis
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install_test_redis.py 8.0.6 /tmp/test-redis
      - name: Put Redis on the PATH
        run: echo /tmp/test-redis/bin >> "$GITHUB_PATH"
      - name: Check example formatting
        run: crystal tool format --check examples/docs/core/*.cr examples/docs/pro/*.cr
      - name: Run documentation examples against isolated Redis
        run: python3 scripts/test_docs_examples.py --edition core
