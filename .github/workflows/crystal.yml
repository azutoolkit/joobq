name: Crystal CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal:1.22.0

    services:
      redis:
        image: redis:7.4
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JOOBQ_ENV: test
      REDIS_URL: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: shards install --frozen

      - name: Format
        run: crystal tool format --check src spec

      # Crystal's default execution context is parallel: races only show with more than one thread.
      - name: Run tests (1 worker)
        run: crystal spec
        env:
          CRYSTAL_WORKERS: 1

      - name: Run tests (4 workers)
        run: crystal spec
        env:
          CRYSTAL_WORKERS: 4

      - name: Install isolated Redis crash-test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends redis-server redis-tools python3

      - name: Verify acknowledged jobs survive Redis SIGKILL and AOF restart
        run: python3 scripts/redis_restart_smoke.py
        env:
          CRYSTAL_WORKERS: 4
