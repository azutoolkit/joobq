name: Crystal CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
# Serialize master releases without cancelling a run between its tag and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.4.12", "8.0.6"]
        workers: [1, 4]
        connection: [legacy, url]
    container:
      image: crystallang/crystal:1.22.0
    steps:
      - uses: actions/checkout@v4
      - name: Install integration tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 openssl curl libssl-dev build-essential ca-certificates
      - name: Install locked dependencies
        run: shards install --frozen
      - name: Build pinned Redis with TLS
        run: |
          python3 scripts/install_test_redis.py "${{ matrix.redis }}" /tmp/test-redis
          echo /tmp/test-redis/bin >> "$GITHUB_PATH"
      - name: Format
        run: crystal tool format --check src spec
      - name: Specs with real TLS and independent Redis stores (no skips)
        run: python3 scripts/run_integration.py ${{ matrix.connection == 'url' && '--url' || '' }}
        env:
          CRYSTAL_WORKERS: ${{ matrix.workers }}
      - name: Redis SIGKILL and AOF recovery
        run: python3 scripts/redis_restart_smoke.py
        env:
          CRYSTAL_WORKERS: ${{ matrix.workers }}
      - name: Leased worker SIGKILL and bounded signal drain
        if: matrix.workers == 4 && matrix.connection == 'url'
        run: python3 scripts/run_integration.py --probe python3 scripts/leased_process_probe.py
        env:
          CRYSTAL_WORKERS: 4
      - name: Bounded fault soak smoke (not the four-hour release gate)
        if: matrix.workers == 4 && matrix.connection == 'url'
        run: |
          crystal build benchmarks/soak.cr --release -o /tmp/joobq-soak
          python3 scripts/run_integration.py --probe /tmp/joobq-soak
        env:
          CRYSTAL_WORKERS: 4
          SOAK_SECONDS: 60
          SOAK_RATE: 50
      - name: Batched leased worker SIGKILL and bounded signal drain
        if: matrix.workers == 4 && matrix.connection == 'url'
        run: python3 scripts/run_integration.py --probe python3 scripts/leased_process_probe.py
        env:
          CRYSTAL_WORKERS: 4
          PROBE_BATCH_SIZE: 8

  release-tests:
    name: Release lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioning, atomic pushes and recovery with local Git remotes
        run: python3 .github/scripts/test_release.py

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, release-tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Like Azu: use a bypass-capable token only when branch rules require it.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Commit matching shard version and atomically push master and tag
        id: prepare
        run: python3 .github/scripts/release.py
      - name: Publish GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ steps.prepare.outputs.latest }}
        run: python3 .github/scripts/release.py --publish "$RELEASE_TAG" --latest "$RELEASE_LATEST"
