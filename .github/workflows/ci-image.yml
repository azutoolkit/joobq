name: CI image
# Builds the image the CI jobs run in (.github/ci-image/Dockerfile) and pushes it to ghcr.io under the tag in
# .github/ci-image/TAG. Runs when that directory changes on master, or by hand.
on:
  push:
    branches: [master]
    paths: ['.github/ci-image/**', '.github/workflows/ci-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(tr -d '[:space:]' < .github/ci-image/TAG)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .github/ci-image
          push: true
          tags: ghcr.io/azutoolkit/joobq-ci:${{ steps.tag.outputs.tag }}
