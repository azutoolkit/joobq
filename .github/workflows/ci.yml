name: CI

# One workflow, started by a push to master (a merge) or by hand. The `changes` job reads the files the push changed
# since the last successful run (.github/scripts/changed_paths.py) and only the jobs that read those files run:
#
#   code     src/, spec/, config/, shard files, the integration scripts  ->  specs (5 Redis legs) and the Crystal floor and
#                                                                           latest (2 legs; latest is not gating), then the release
#   book     docs/, examples/docs/, .gitbook.yaml, gitbook-docs.yaml     ->  documentation checks
#   examples examples/docs/, the docs example runner                     ->  documentation programs on Core
#   image    .github/ci-image/                                           ->  rebuild the CI image first
#
# A push that touches none of them (README, CHANGELOG, design notes, ...) runs `changes` and stops. GitBook itself syncs
# from master through its GitHub app; this workflow only checks that the files it reads are sound.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild and push the CI image (master only)
        type: boolean
        default: false

permissions:
  contents: read

# A master run finishes its tag-and-release step uninterrupted; a queued one is replaced by the newest push. Manual runs
# have their own group so they cannot replace a queued push run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# What CI covers is what docs/reference/compatibility.md, README.md and CLAUDE.md claim (.github/scripts/test_ci_matrix.py
# fails when they disagree). Redis: 6.2 (the floor: LMOVE/BLMOVE), 7.4 and 8.0, on Crystal 1.22.1 (the CI image). Crystal:
# 1.22.0 (the floor, shard.yml; gates the release) and `latest` (reported, not gating) on Redis 8.0. Not tested: glibc, ARM, macOS, Crystal nightly, Redis Cluster.
env:
  REDIS_VERSION: "8.0.6" # the newest Redis; the examples job and the format check run on it

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the newest successful run of this workflow
    outputs:
      code: ${{ steps.paths.outputs.code }}
      book: ${{ steps.paths.outputs.book }}
      examples: ${{ steps.paths.outputs.examples }}
      image: ${{ steps.paths.outputs.image }}
      image_tag: ${{ steps.paths.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/scripts -p 'test_changed_paths.py'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_ci_matrix.py'
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.sha }}
          REBUILD_IMAGE: ${{ inputs.rebuild_image }}
        run: python3 .github/scripts/changed_paths.py

  # Only when .github/ci-image changed: the jobs below pull the tag this builds, so it goes first.
  image:
    name: CI image
    needs: changes
    if: needs.changes.outputs.image == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .github/ci-image
          push: true
          tags: ghcr.io/azutoolkit/joobq-ci:${{ needs.changes.outputs.image_tag }}

  # One runtime worker per leg. Crystal 1.22.1 (the CI image) against the Redis floor, a 7.x and the newest, each once
  # per connection style where it matters: the two runs of this workflow on 8.0.6, the floor on both too (the oldest
  # server is the one the connection code is most likely to meet a difference on), 7.4 on the legacy one.
  specs:
    name: Specs (Redis ${{ matrix.redis }}, ${{ matrix.connection }})
    needs: [changes, image]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # the CI image on ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - {redis: "8.0.6", connection: legacy}
          - {redis: "8.0.6", connection: url}
          - {redis: "7.4.12", connection: legacy}
          - {redis: "6.2.24", connection: legacy}
          - {redis: "6.2.24", connection: url}
    container:
      image: ghcr.io/azutoolkit/joobq-ci:${{ needs.changes.outputs.image_tag }} # .github/ci-image: Crystal 1.22.1 on Alpine
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      CRYSTAL_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Format
        if: matrix.connection == 'legacy' && matrix.redis == env.REDIS_VERSION # independent of the connection style and the server
        run: crystal tool format --check src spec
      - uses: ./.github/actions/run-specs
        with:
          redis: ${{ matrix.redis }}
          connection: ${{ matrix.connection }}

  # The Crystal range: the declared floor (shard.yml `crystal: ">= 1.22.0"`) and the newest release, on the official
  # Alpine images (the CI image is pinned to 1.22.1), against the newest Redis. Only the floor gates the release:
  # `latest` floats, so a new Crystal release, a mirror failure or a Docker Hub limit must not stop every release
  # (nor make the run a failed baseline for changed_paths.py). A red `latest` leg is reported (the leg and its
  # annotation show red, the run stays green): read it. Not formatted here: the formatter is checked once, by the
  # leg on the CI image.
  crystal:
    name: Specs (Crystal ${{ matrix.crystal }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.crystal == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.22.0", latest]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}-alpine
    env:
      CRYSTAL_WORKERS: "1"
    steps:
      # The same packages as .github/ci-image/Dockerfile (a spec checks the lists agree); the official image lacks some.
      - name: System packages
        shell: sh
        run: |
          packages="bash python3 curl git make gcc g++ musl-dev linux-headers openssl openssl-dev tar zstd"
          apk add --no-cache $packages || { sleep 15; apk add --no-cache $packages; }
      - uses: actions/checkout@v4
      - run: crystal --version
      - uses: ./.github/actions/run-specs
        with:
          redis: ${{ env.REDIS_VERSION }}
          connection: legacy

  book:
    name: Documentation book
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s scripts -p 'test_check_docs.py'

  examples:
    name: Documentation examples (Core)
    needs: [changes, image]
    if: ${{ !cancelled() && needs.changes.outputs.examples == 'true' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/azutoolkit/joobq-ci:${{ needs.changes.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install released Core graph
        working-directory: examples/docs/core
        run: shards install --frozen
      - uses: ./.github/actions/pinned-redis
        with:
          version: ${{ env.REDIS_VERSION }}
      - run: crystal tool format --check examples/docs/core/*.cr examples/docs/pro/*.cr
      - name: Run documentation examples against isolated Redis
        run: python3 scripts/test_docs_examples.py --edition core

  # The release lifecycle checks (versioning, atomic pushes, recovery with local Git remotes) run first in this job:
  # they gate the same release without a runner of their own. Only a master push whose specs ran and passed gets here.
  release:
    name: Publish release
    needs: [changes, specs, crystal]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.changes.outputs.code == 'true' && needs.specs.result == 'success' && needs.crystal.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify manifest versions, protected branches and recovery with local Git remotes
        run: python3 .github/scripts/test_release.py
      - name: Tag the exact tested manifest version
        id: prepare
        run: python3 .github/scripts/release.py
      - name: Publish GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ steps.prepare.outputs.latest }}
        run: python3 .github/scripts/release.py --publish "$RELEASE_TAG" --latest "$RELEASE_LATEST"
      # master moved on while this run was going, so a newer run must release. This run fails on purpose: a failed run is
      # never the baseline of changed_paths.py, so that newer run re-runs the specs on this code even if it changed only docs.
      - name: Release deferred to a newer run
        if: steps.prepare.outputs.deferred == 'true'
        run: |
          echo "::error::master advanced during this run; the next run on master releases. Failing so its changed-files baseline stays before this commit."
          exit 1
